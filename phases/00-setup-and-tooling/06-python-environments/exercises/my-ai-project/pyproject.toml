[project]
name = "my-ai-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ahmad Abuziad", email = "aabuziadc@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.3.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
