    "torchaudio>=2.11.0",
    "torchvision>=0.29.0",
]

[project.scripts]
my-ai-project = "my_ai_project:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
